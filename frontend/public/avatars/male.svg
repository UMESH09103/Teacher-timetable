  <path d="M 58 78 C 55 55 60 40 72 32 C 82 25 98 25 106 32 C 114 26 128 26 136 34 C 144 42 145 58 142 76 C 138 68 134 66 126 68 C 116 70 108 65 98 62 C 86 58 74 65 65 72 C 60 76 59 78 58 78 Z" fill="#111827" />
